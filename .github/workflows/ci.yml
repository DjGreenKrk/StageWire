name: Testy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: stagewire
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stagewire/package-lock.json
      - name: Instalacja zależności
        run: npm ci
      - name: Sprawdzenie typów
        run: npm run typecheck
      - name: Testy jednostkowe
        run: npm test
      - name: Walidacja przykładowych pakietów urządzeń
        run: npm run packs:validate
      - name: Budowa interfejsu
        run: npm run build:web
